; Assetto Corsa Rally Head Tracking - configuration
; Edit values, restart the game to apply.
;
; Controls: Home / Ctrl+Shift+T   recenter
;           End  / Ctrl+Shift+Y   toggle tracking
;           PgUp / Ctrl+Shift+G   cycle tracking mode (rotation and position
;                                 / rotation only / position only)

[Network]
UdpPort=4242

[General]
EnableOnStartup=1

[Rotation]
YawSensitivity=1.0
PitchSensitivity=1.0
RollSensitivity=1.0
InvertYaw=0
InvertPitch=0
InvertRoll=0
Smoothing=0.0

[Camera]
; Near clip plane in centimetres, applied while head tracking is driving
; the view. The game's own 5.0 sits further from your eye than the seat
; back behind you, so looking over a shoulder clips the seat away and you
; see straight through it. Pulling the plane in renders it instead.
; 0 leaves the game's value alone.
NearClipCm=1.0

[Position]
Enabled=1
SensitivityX=1.0
SensitivityY=1.0
SensitivityZ=1.0
InvertX=0
InvertY=0
InvertZ=0
; How far the camera may travel from where the game put it, in metres.
; These are cabin-sized: the headrest is against the back of your head and
; the windscreen is an arm's length away, so a head allowed to roam a
; room's worth of space ends up inside the seat or out over the bonnet.
LimitX=0.15
LimitY=0.12
LimitZ=0.20
; Backward travel. Zero by default: strapped into a rally seat your head
; is already touching the headrest, so there is nowhere to go and any
; travel here is spent moving your eye into the seat. Raise it only if you
; sit forward of the headrest.
LimitZBack=0.0
Smoothing=0.15
